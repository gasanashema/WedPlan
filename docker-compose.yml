version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wedplan_postgres_db
    restart: always
    environment:
      POSTGRES_DB: wedding_plan_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: UTC
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wedding_plan_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - wedplan_pg_data:/var/lib/postgresql/data

volumes:
  wedplan_pg_data:
    name: wedplan_pg_data
